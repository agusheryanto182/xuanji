services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres:5432
      REDIS_HOST: redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app

  redis:
    image: redis:8-alpine
