services:
  postgres:
    image: postgres:18
    container_name: xuanji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xuanji
      POSTGRES_PASSWORD: xuanji
      POSTGRES_DB: xuanji
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
