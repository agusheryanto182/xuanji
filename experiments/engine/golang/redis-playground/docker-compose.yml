x-postgres-environment: &postgres-environment
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "myAwEsOm3pa55@w0rd"
  POSTGRES_DB: "redis_playground_db"

x-app-environment: &app-environment
  GOMAXPROCS: "1"

  # App
  APP_NAME: "redis-playground"
  APP_VERSION: "1.0.0"

  # HTTP
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"

  # Logger
  LOG_LEVEL: "debug"

  # PostgreSQL
  PG_POOL_MAX: "2"
  PG_URL: "postgres://user:myAwEsOm3pa55@w0rd@localhost:5432/redis_playground_db"

  # Redis
  REDIS_URL: "redis://localhost:6379/0"

  # Metrics
  METRICS_ENABLED: "true"

  # Swagger
  SWAGGER_ENABLED: "true"

  # JWT
  JWT_TOKEN_EXPIRY: "24h"
  JWT_SECRET: "your-secret-key-change-in-production"

x-healthcheck-postgres: &healthcheck-postgres
  test: ["CMD-SHELL", "pg_isready -U user -d redis_playground_db"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-healthcheck-redis: &healthcheck-redis
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  postgres:
    <<: *restart-policy
    container_name: redis_playground_postgres
    image: postgres:18.4-alpine
    environment:
      <<: *postgres-environment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck-postgres
    networks:
      - app_network

  redis:
    <<: *restart-policy
    container_name: redis_playground_redis
    image: redis:8.2.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-redis
    networks:
      - app_network

  app:
    <<: *restart-policy
    container_name: redis_playground_app
    platform: linux/amd64
    pid: host
    build:
      context: .
    environment:
      <<: *app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    <<: *restart-policy
    container_name: redis_playground_nginx
    image: nginx:1.31.0-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
