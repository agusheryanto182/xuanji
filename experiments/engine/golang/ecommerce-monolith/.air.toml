#:schema https://json.schemastore.org/any.json
env_files = [".env"]

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/app"
  bin = "./tmp/main"

  include_ext = ["go", "yaml", "yml", "toml", "env"]
  exclude_dir = ["tmp", "vendor", ".git", "testdata"]

  exclude_regex = ["_test.go"]

  delay = 500
  stop_on_error = true

[log]
  time = true

[screen]
  clear_on_rebuild = false